name: AnyViewer Windows RDP

on:
  workflow_dispatch:

jobs:
  start-rdp:
    runs-on: windows-latest

    steps:
      - name: Descargar y preparar entorno
        shell: powershell
        run: |
          # Guardar "secretos" (no es seguro dejarlos en texto plano)
          Set-Content -Path secrets.txt -Value "EMAIL_SECRET=aminayoscardj@gmail.com`nPASSWORD_SECRET=Lynaescoqueta123!"

          # Descargar el archivo .bat desde Dropbox
          Invoke-WebRequest -Uri "https://dl.dropboxusercontent.com/scl/fi/xyz123/down.bat?rlkey=..." -OutFile "down.bat"

          # Comprobar si se descargó
          if (!(Test-Path "down.bat")) {
            Write-Error "No se pudo descargar down.bat"
            exit 1
          }

          # Ejecutar el archivo .bat descargado
          Start-Process "cmd.exe" -ArgumentList "/c down.bat" -Wait

      - name: Mostrar credenciales
        shell: cmd
        run: show.bat

      - name: Mantener activo el entorno (4h)
        shell: powershell
        run: Start-Sleep -Seconds 14400
